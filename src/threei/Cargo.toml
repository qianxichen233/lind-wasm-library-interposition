[package]
name = "threei"
version = "0.1.0"
edition = "2021"

[dependencies]
libc = "0.2"
sysdefs = { path = "../sysdefs" }
typemap = { path = "../typemap" }
cage = { path = "../cage" }
dashmap = { version = "6" }
once_cell = "1.18" 
lazy_static = "1.4"
parking_lot = "0.12"
nodit = "0.9.2" # Used for VMMAP

[features]
default = ["hashmap"]
hashmap = []
dashmap = []
lind-logging = ["sysdefs/lind-logging"]

[dev-dependencies]
serial_test = "3"
# cage::Cage's own fields are built against dashmap 5.x (see src/cage/Cargo.toml),
# distinct from this crate's own dashmap 6.x -- aliased so tests constructing a
# real Cage literal (see tests/v2_transport_tests.rs) use the matching type.
dashmap5 = { package = "dashmap", version = "5.1" }
